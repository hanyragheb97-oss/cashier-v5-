<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير مصروفات مفصل</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0d1e">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">

    <!-- المكتبات المحلية للعمل أوفلاين 100% -->
    <script src="./libs/xlsx.full.min.js" defer></script>
    <script src="./libs/html2pdf.bundle.min.js" defer></script>

    <style>
        .report-main-wrap {
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
            padding: 12px 12px 95px;
            box-sizing: border-box;
        }

        .amount-pill {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            border: 1.5px solid var(--accent-red);
            color: var(--accent-red);
            background-color: var(--surface-subtle);
            direction: ltr;
        }

        .report-total-footer td {
            background-color: var(--table-header-bg);
            border-top: 2px solid var(--neon-border);
            padding: 15px 10px;
            font-size: 17px;
            font-weight: bold;
        }
    </style>
</head>
<body class="page-records" onclick="closeAllMenus()">

    <div class="header header-records">
        <span>تقرير مصروفات مفصل</span>
    </div>

    <div class="report-main-wrap">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input seraj-search-input" placeholder="ابحث بجهة الصرف..." oninput="debouncedRender()" onclick="event.stopPropagation()" autocomplete="off">
        </div>

        <div class="table-wrapper" id="pdf-wrapper" style="max-height: none;">
            <table class="seraj-table">
                <thead>
                    <tr>
                        <th style="width: 60%; text-align: right;">جهة الصرف</th>
                        <th style="width: 40%;">المبلغ المصروف</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot>
                    <tr class="report-total-footer">
                        <td colspan="2">
                            الإجمالي = <span id="grandTotal" class="val-red" dir="ltr">0.00</span> ج
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- الشريط السفلي الموحد -->
    <div class="unified-bottom-bar" onclick="event.stopPropagation()">
        <button type="button" class="header-back-btn" onclick="handleSmartBack()">
            <span class="arrow">⬅</span>
            <span class="text">BACK</span>
        </button>

        <div class="bottom-capsules">
            <div class="capsule" onclick="toggleDurationMenu(event)">
                📅 <span id="currentDurationLabelOutside">آخر 30 يوم</span>
                <div class="dropdown-menu" id="durationDropdownOutside">
                    <div class="dropdown-menu-item" onclick="filterByDate('اليوم', 'today')">اليوم</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('أمس', 'yesterday')">أمس</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('آخر 7 أيام', '7days')">آخر 7 أيام</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('هذا الشهر', 'this_month')">هذا الشهر</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('آخر 30 يوم', '30days')">آخر 30 يوم</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('الشهر الماضي', 'last_month')">الشهر الماضي</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('مدى العمل (الكل)', 'all_time')">مدى العمل (الكل)</div>
                    <div class="dropdown-menu-item" onclick="openCustomDateModal()">📅 تاريخ مخصص...</div>
                </div>
            </div>

            <div class="capsule print-btn" onclick="togglePrintOptions(event)">
                🖨️ خيارات
                <div class="dropdown-menu" id="floatingPrintMenu">
                    <div class="dropdown-menu-item" onclick="handlePrintAction('thermal')">🧾 طباعة حرارية (80mm)</div>
                    <div class="dropdown-menu-item" onclick="handlePrintAction('a4')">🖨️ طباعة ورقة (A4)</div>
                    <div class="dropdown-menu-item" onclick="handlePrintAction('pdf_export')">📄 مشاركة / تصدير PDF</div>
                    <div class="dropdown-menu-item" onclick="handlePrintAction('excel_export')">📊 تصدير Excel</div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة التاريخ المخصص -->
    <div class="modal-overlay" id="customDateModal" onclick="window.SerajUI.closeModal('customDateModal')">
        <div class="compact-modal" onclick="event.stopPropagation()">
            <div class="compact-header"><h3>تحديد تاريخ مخصص</h3></div>
            <div class="compact-row"><label>من تاريخ:</label><input type="date" id="dateFrom"></div>
            <div class="compact-row"><label>إلى تاريخ:</label><input type="date" id="dateTo"></div>
            <div class="compact-btns">
                <button type="button" class="btn-close-ai" onclick="window.SerajUI.closeModal('customDateModal')">إلغاء</button>
                <button type="button" class="btn-save-ai" onclick="applyCustomDate()">تطبيق البحث</button>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="print_manager.js"></script>

    <script>
        let currentDateFilter = '30days';
        let currentDurationLabel = 'آخر 30 يوم';
        let customDateFrom = null;
        let customDateTo = null;
        let lastExpensesList = [];
        let lastGrandTotal = 0;

        const VAULT_SHORT = {
            main: 'كاش',
            insta: 'إنستا',
            wallet: 'محفظة'
        };

        const safeHTML = (v) => window.Utils.sanitizeHTML(v);
        const round2 = (v) => window.Utils.round2(v);

        function updatePageBranding() {
            const brand = window.PrintManager ? window.PrintManager.getShopBranding() : { shopName: window.APP_BRAND_CONFIG.appName };
            document.title = `تقرير مصروفات مفصل - ${brand.shopName}`;
        }

        function handleSmartBack() {
            localStorage.setItem('seraj_active_tab', 'المصروفات');
            window.location.href = 'smart_accountant.html';
        }

        function closeAllMenus() {
            ['durationDropdownOutside', 'floatingPrintMenu'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
        }

        function toggleDurationMenu(e) {
            if (e) e.stopPropagation();
            const m = document.getElementById('durationDropdownOutside');
            const isVisible = m && m.style.display === 'block';
            closeAllMenus();
            if (m && !isVisible) m.style.display = 'block';
        }

        function togglePrintOptions(e) {
            if (e) e.stopPropagation();
            const m = document.getElementById('floatingPrintMenu');
            const isVisible = m && m.style.display === 'block';
            closeAllMenus();
            if (m && !isVisible) m.style.display = 'block';
        }

        function checkDateFilter(itemDateVal) {
            if (currentDateFilter === 'all_time') return true;
            const itemIso = window.Utils.normalizeDateStr(itemDateVal);
            if (!itemIso) return false;

            const now = new Date();
            const todayIso = window.Utils.getLocalDateString(now);

            if (currentDateFilter === 'today') return itemIso === todayIso;
            if (currentDateFilter === 'yesterday') {
                const y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
                return itemIso === window.Utils.getLocalDateString(y);
            }
            if (currentDateFilter === '7days') {
                const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7);
                return itemIso >= window.Utils.getLocalDateString(d) && itemIso <= todayIso;
            }
            if (currentDateFilter === '30days') {
                const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 30);
                return itemIso >= window.Utils.getLocalDateString(d) && itemIso <= todayIso;
            }
            if (currentDateFilter === 'this_month') {
                const firstM = window.Utils.getLocalDateString(new Date(now.getFullYear(), now.getMonth(), 1));
                return itemIso >= firstM && itemIso <= todayIso;
            }
            if (currentDateFilter === 'last_month') {
                const lm = window.Utils.getLastMonthRange(now);
                return itemIso >= lm.start && itemIso <= lm.end;
            }
            if (currentDateFilter === 'custom' && customDateFrom && customDateTo) {
                return itemIso >= customDateFrom && itemIso <= customDateTo;
            }
            return false;
        }

        function filterByDate(label, val) {
            currentDateFilter = val;
            currentDurationLabel = label;
            const outLbl = document.getElementById('currentDurationLabelOutside');
            if (outLbl) outLbl.textContent = label;
            closeAllMenus();
            renderTable();
        }

        function openCustomDateModal() {
            closeAllMenus();
            window.SerajUI.openModal('customDateModal');
        }

        function applyCustomDate() {
            const f = document.getElementById('dateFrom').value;
            const t = document.getElementById('dateTo').value;
            if (!f || !t) return SerajAlert('يرجى تحديد تاريخ البداية والنهاية.', 'error');
            currentDateFilter = 'custom';
            customDateFrom = f;
            customDateTo = t;
            currentDurationLabel = `${f} إلى ${t}`;
            document.getElementById('currentDurationLabelOutside').textContent = 'تاريخ مخصص';
            window.SerajUI.closeModal('customDateModal');
            renderTable();
        }

        const debouncedRender = window.Utils.debounce(function() {
            renderTable();
        }, 160);

        function renderTable() {
            const normQ = window.Utils.normalizeName(document.getElementById('searchInput')?.value || '');
            const activeExpenses = DB.getExpenses(false) || [];

            const expenses = [];
            activeExpenses.forEach(m => {
                if (!m || m.isCanceled || m.isDeleted || m._isReversed || m._isReversal) return;
                const normDate = window.Utils.normalizeDateStr(m.date, m.timestamp);
                if (!checkDateFilter(normDate)) return;

                const notes = String(m.notes || 'بدون جهة').trim();
                const vaultLabel = VAULT_SHORT[m.vault || m.treasury || 'main'] || 'كاش';
                if (normQ) {
                    const hay = `${window.Utils.normalizeName(notes)} ${window.Utils.normalizeName(vaultLabel)}`;
                    if (!hay.includes(normQ)) return;
                }

                const amount = round2(m.amount ?? m.amountDeduct ?? 0);
                if (amount > 0.009) {
                    expenses.push({
                        id: m.id,
                        destination: notes,
                        vaultLabel: vaultLabel,
                        device: String(m._device || '').trim(),
                        amount: amount,
                        date: normDate,
                        timestamp: window.Utils.getSafeTime(m.timestamp || normDate) || 0
                    });
                }
            });

            expenses.sort((a, b) => {
                if (b.timestamp !== a.timestamp) return b.timestamp - a.timestamp;
                return window.Utils.extractSerialNum(b.id) - window.Utils.extractSerialNum(a.id);
            });

            lastExpensesList = expenses;
            const tbody = document.getElementById('tableBody');

            if (expenses.length === 0) {
                lastGrandTotal = 0;
                tbody.innerHTML = `<tr><td colspan="2" style="padding: 24px; color: var(--text-muted);">لا توجد مصروفات مسجلة في هذه الفترة</td></tr>`;
                document.getElementById('grandTotal').textContent = '0.00';
                return;
            }

            let grandTotal = 0;
            tbody.innerHTML = expenses.map(exp => {
                grandTotal = round2(grandTotal + exp.amount);
                const devMeta = exp.device ? ` | 📱 ${safeHTML(exp.device)}` : '';
                return `
                    <tr>
                        <td style="text-align: right;">
                            <div>${safeHTML(exp.destination)}</div>
                            <span class="cell-meta">📅 ${safeHTML(exp.date)} | (${safeHTML(exp.vaultLabel)})${devMeta}</span>
                        </td>
                        <td>
                            <span class="amount-pill">${exp.amount.toFixed(2)} ج</span>
                        </td>
                    </tr>
                `;
            }).join('');

            lastGrandTotal = grandTotal;
            document.getElementById('grandTotal').textContent = grandTotal.toFixed(2);
        }

        // =========================================================================
        // الطباعة (فصل 80mm عن A4) و PDF (downloadRealPDF) و Excel
        // =========================================================================
        function _buildA4ReportHTML() {
            const brand = window.PrintManager.getShopBranding();
            const todayStr = window.Utils.getLocalDateString();
            const rowsHtml = lastExpensesList.map((exp, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td style="text-align: right;">${safeHTML(exp.destination)}</td>
                    <td>${safeHTML(exp.date)}</td>
                    <td>${safeHTML(exp.vaultLabel)}</td>
                    <td dir="ltr" class="val-red">${exp.amount.toFixed(2)}</td>
                </tr>
            `).join('');

            return `
                <div dir="rtl" style="background:#fff; color:#000; padding:10px; font-family:Tahoma, Arial, sans-serif;">
                    <div style="text-align:center; border-bottom:3px solid #000; padding-bottom:10px; margin-bottom:14px;">
                        <h1 style="margin:0; font-size:24px;">${safeHTML(brand.shopName)} — تقرير مصروفات مفصل</h1>
                        ${brand.shopPhone ? `<div style="font-size:13px; margin-top:3px;">ت: ${safeHTML(brand.shopPhone)}</div>` : ''}
                        <div style="font-size:14px; font-weight:bold; margin-top:4px;">الفترة: ${safeHTML(currentDurationLabel)} | التاريخ: ${safeHTML(todayStr)}</div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width:10%;">م</th>
                                <th style="width:44%; text-align:right;">جهة الصرف</th>
                                <th style="width:18%;">التاريخ</th>
                                <th style="width:12%;">الخزينة</th>
                                <th style="width:16%;">المبلغ</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                    <div style="width:100%; max-width:340px; margin-right:auto; border:2px solid #000; border-radius:6px; padding:10px; margin-top:14px; background:#f8fafc;">
                        <div style="display:flex; justify-content:space-between;"><span>إجمالي المصروفات:</span><strong class="val-red">${lastGrandTotal.toFixed(2)} ج</strong></div>
                    </div>
                </div>
            `;
        }

        function printThermalReport() {
            if (lastExpensesList.length === 0) return SerajAlert('لا توجد مصروفات للطباعة!', 'info');
            const brand = window.PrintManager.getShopBranding();
            const rowsHtml = lastExpensesList.map(exp => `
                <tr>
                    <td style="text-align:right; padding:4px 2px; border-bottom:1px dotted #333;">${safeHTML(exp.destination)}<br><small>${safeHTML(exp.date)} (${safeHTML(exp.vaultLabel)})</small></td>
                    <td style="text-align:left; padding:4px 2px; border-bottom:1px dotted #333; font-weight:bold;" dir="ltr">${exp.amount.toFixed(2)}</td>
                </tr>
            `).join('');

            const docHtml = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>تقرير مصروفات مفصل</title><style>@page{size:80mm auto;margin:0;}body{margin:0;padding:4mm 2mm;width:74mm;box-sizing:border-box;font-family:Tahoma,Arial,sans-serif;font-size:12px;color:#000;background:#fff;}</style></head><body>
                <div style="text-align:center; border-bottom:2px dashed #000; padding-bottom:6px; margin-bottom:8px;">
                    <div style="font-size:17px; font-weight:bold;">${safeHTML(brand.shopName)}</div>
                    <div style="font-weight:bold;">تقرير المصروفات المفصل</div>
                    <div>${safeHTML(currentDurationLabel)}</div>
                </div>
                <table style="width:100%; border-collapse:collapse;">
                    <thead><tr style="border-bottom:1px solid #000;"><th style="text-align:right;">جهة الصرف</th><th style="text-align:left;">المبلغ</th></tr></thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
                <div style="border-top:2px dashed #000; margin-top:8px; padding-top:6px; font-weight:bold; font-size:14px;">
                    إجمالي المصروفات: ${lastGrandTotal.toFixed(2)} ج
                </div>
                <div style="text-align:center; margin-top:10px; border-top:1px dashed #000; padding-top:6px;">${safeHTML(brand.footerNote)}</div>
            </body></html>`;
            window.PrintManager._printHtmlViaSafeIframe(docHtml);
        }

        function handlePrintAction(action) {
            closeAllMenus();
            if (lastExpensesList.length === 0) return SerajAlert('لا توجد مصروفات في هذه الفترة!', 'info');

            if (action === 'thermal') {
                printThermalReport();
            } else if (action === 'a4') {
                window.PrintManager.printA4HTML(_buildA4ReportHTML(), 'تقرير مصروفات مفصل');
            } else if (action === 'pdf_export') {
                window.Utils.downloadRealPDF(_buildA4ReportHTML(), `Expenses_Detailed_${window.Utils.getLocalDateString()}.pdf`);
            } else if (action === 'excel_export') {
                const excelData = [
                    ['جهة الصرف', 'تاريخ الصرف', 'الخزينة', 'المبلغ المصروف'],
                    ...lastExpensesList.map(exp => [exp.destination, exp.date, exp.vaultLabel, exp.amount]),
                    [],
                    ['الإجمالي', '', '', lastGrandTotal]
                ];
                window.PrintManager.exportToExcel(excelData, `Expenses_Detailed_${window.Utils.getLocalDateString()}`);
            }
        }

        async function initPage() {
            await window.SerajMegaDB.ready;
            DB.applySavedTheme();
            window.SerajAuth.applyRoleGuards();
            updatePageBranding();
            renderTable();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPage();
        });

        window.addEventListener('seraj:updated', (e) => {
            const col = e && e.detail ? e.detail.collection : null;
            if (!col || ['all', 'treasury_moves', 'store_settings'].includes(col)) {
                updatePageBranding();
                renderTable();
            }
        });

        window.addEventListener('popstate', () => {
            if (window.SerajUI._modalStack.length > 0) return;
            handleSmartBack();
        });
    </script>
</body>
</html>
