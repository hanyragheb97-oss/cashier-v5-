<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشف حساب عميل</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0d1e">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">

    <!-- المكتبات المحلية للعمل أوفلاين 100% -->
    <script src="./libs/xlsx.full.min.js" defer></script>
    <script src="./libs/html2pdf.bundle.min.js" defer></script>

    <style>
        .report-main-wrap {
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
            padding: 12px 12px 95px;
            box-sizing: border-box;
        }

        .picker-card {
            background-color: var(--card-bg-alt);
            border: 2px solid var(--neon-border);
            border-radius: 16px;
            padding: 18px 14px;
            margin-top: 20px;
            box-shadow: 0 0 18px var(--neon-glow);
        }

        .picker-label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: var(--neon-border);
            margin-bottom: 10px;
            text-align: right;
        }

        .stmt-prev-row td {
            background-color: var(--card-bg-alt);
            border-bottom: 2px solid var(--neon-border-soft);
        }

        .stmt-total-row td {
            background-color: var(--table-header-bg);
            border-top: 2px solid var(--neon-border);
            font-size: 16px;
        }

        .stmt-net-row td {
            background-color: var(--card-bg-alt);
            font-size: 17px;
            padding: 14px 10px;
        }

        .stmt-alltime-row td {
            background-color: var(--bg-dark-2);
            font-size: 14px;
            padding: 10px;
        }
    </style>
</head>
<body class="page-records" onclick="closeAllMenus()">

    <!-- الشاشة 1: اختيار العميل -->
    <div id="select-customer-view" class="view-section active-view">
        <div class="header header-records">
            <span>كشف حساب عميل</span>
        </div>

        <div class="report-main-wrap">
            <div class="picker-card" onclick="event.stopPropagation()">
                <label class="picker-label" for="customerSearchInput">اختر العميل أولاً:</label>
                <div class="search-container" style="margin-bottom: 0;">
                    <input type="text" id="customerSearchInput" class="search-input seraj-search-input" placeholder="اكتب اسم العميل أو الموبايل هنا..." oninput="debouncedCustomerSearch()" onclick="this.select()" autocomplete="off">
                    <div id="customerDropdown" class="dropdown-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- الشاشة 2: كشف حساب العميل المحدد -->
    <div id="customer-statement-view" class="view-section">
        <div class="header header-records">
            <span id="reportHeaderTitle">كشف حساب العميل</span>
        </div>

        <div class="report-main-wrap">
            <div class="table-wrapper" id="pdf-wrapper" style="max-height: none;">
                <table class="seraj-table" id="printableStatementTable">
                    <thead>
                        <tr>
                            <th style="width: 56%; text-align: right;">البيان، التاريخ والملاحظات</th>
                            <th class="val-red" style="width: 22%;">عليه (مديونية)</th>
                            <th class="val-green" style="width: 22%;">له (تسديد)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- الشريط السفلي الموحد -->
    <div class="unified-bottom-bar" onclick="event.stopPropagation()">
        <button type="button" class="header-back-btn" onclick="handleSmartBack()">
            <span class="arrow">⬅</span>
            <span class="text">BACK</span>
        </button>

        <div class="bottom-capsules">
            <div class="capsule" onclick="toggleDurationMenu(event)">
                📅 <span id="currentDurationLabelOutside">مدى العمل (الكل)</span>
                <div class="dropdown-menu" id="durationDropdownOutside">
                    <div class="dropdown-menu-item" onclick="filterByDate('اليوم', 'today')">اليوم</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('أمس', 'yesterday')">أمس</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('آخر 7 أيام', '7days')">آخر 7 أيام</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('هذا الشهر', 'thisMonth')">هذا الشهر</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('آخر 30 يوم', '30days')">آخر 30 يوم</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('الشهر الماضي', 'lastMonth')">الشهر الماضي</div>
                    <div class="dropdown-menu-item" onclick="filterByDate('مدى العمل (الكل)', 'allTime')">مدى العمل (الكل)</div>
                    <div class="dropdown-menu-item" onclick="openCustomDateModal()">📅 تاريخ مخصص...</div>
                </div>
            </div>

            <div class="capsule print-btn" onclick="togglePrintOptions(event)">
                🖨️ خيارات
                <div class="dropdown-menu" id="floatingPrintMenu">
                    <div class="dropdown-menu-item" onclick="handlePrintAction('thermal')">🧾 طباعة حرارية (80mm)</div>
                    <div class="dropdown-menu-item" onclick="handlePrintAction('a4')">🖨️ طباعة ورقة (A4)</div>
                    <div class="dropdown-menu-item" onclick="handlePrintAction('pdf_export')">📄 مشاركة / تصدير PDF</div>
                    <div class="dropdown-menu-item" onclick="handlePrintAction('excel_export')">📊 تصدير Excel</div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة التاريخ المخصص -->
    <div class="modal-overlay" id="customDateModal" onclick="window.SerajUI.closeModal('customDateModal')">
        <div class="compact-modal" onclick="event.stopPropagation()">
            <div class="compact-header"><h3>تحديد تاريخ مخصص</h3></div>
            <div class="compact-row"><label>من تاريخ:</label><input type="date" id="dateFrom"></div>
            <div class="compact-row"><label>إلى تاريخ:</label><input type="date" id="dateTo"></div>
            <div class="compact-btns">
                <button type="button" class="btn-close-ai" onclick="window.SerajUI.closeModal('customDateModal')">إلغاء</button>
                <button type="button" class="btn-save-ai" onclick="applyCustomDate()">تطبيق البحث</button>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="print_manager.js"></script>

    <script>
        let selectedCustomerId = null;
        let selectedCustomerObj = null;
        let currentDateFilter = 'allTime';
        let currentDurationLabel = 'مدى العمل (الكل)';
        let customDateFrom = null;
        let customDateTo = null;
        let lastStatementData = null;

        const safeHTML = (v) => window.Utils.sanitizeHTML(v);
        const round2 = (v) => window.Utils.round2(v);

        function updatePageBranding() {
            const brand = window.PrintManager ? window.PrintManager.getShopBranding() : { shopName: window.APP_BRAND_CONFIG.appName };
            document.title = `كشف حساب عميل - ${brand.shopName}`;
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
        }

        function handleSmartBack(fromPopState = false) {
            closeAllMenus();
            if (document.getElementById('customer-statement-view').classList.contains('active-view')) {
                selectedCustomerId = null;
                selectedCustomerObj = null;
                lastStatementData = null;
                document.getElementById('customerSearchInput').value = '';
                if (!fromPopState && history.state && history.state.view === 'statement') {
                    history.back();
                } else {
                    switchView('select-customer-view');
                    setTimeout(() => document.getElementById('customerSearchInput')?.focus(), 80);
                }
            } else if (!fromPopState) {
                localStorage.setItem('seraj_active_tab', 'العملاء');
                window.location.href = 'smart_accountant.html';
            }
        }

        function closeAllMenus() {
            ['durationDropdownOutside', 'floatingPrintMenu', 'customerDropdown'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
        }

        function toggleDurationMenu(e) {
            if (e) e.stopPropagation();
            const m = document.getElementById('durationDropdownOutside');
            const isVisible = m && m.style.display === 'block';
            closeAllMenus();
            if (m && !isVisible) m.style.display = 'block';
        }

        function togglePrintOptions(e) {
            if (e) e.stopPropagation();
            const m = document.getElementById('floatingPrintMenu');
            const isVisible = m && m.style.display === 'block';
            closeAllMenus();
            if (m && !isVisible) m.style.display = 'block';
        }

        // =========================================================================
        // البحث واختيار العميل (debounce + join('') + Pointer Guard)
        // =========================================================================
        const debouncedCustomerSearch = window.Utils.debounce(function() {
            handleCustomerSearch();
        }, 160);

        function handleCustomerSearch() {
            const rawVal = (document.getElementById('customerSearchInput')?.value || '').trim();
            const normQ = window.Utils.normalizeName(rawVal);
            const dropdown = document.getElementById('customerDropdown');
            if (!dropdown) return;

            if (!normQ) {
                dropdown.style.display = 'none';
                dropdown.innerHTML = '';
                return;
            }

            const allCustomers = DB.getCustomers(false, false) || [];
            const filtered = allCustomers.filter(c => {
                if (!c || !c.name) return false;
                const hay = `${window.Utils.normalizeName(c.name)} ${window.Utils.normalizeName(c.phone || '')}`;
                return hay.includes(normQ);
            }).slice(0, 30);

            if (filtered.length === 0) {
                dropdown.style.display = 'none';
                dropdown.innerHTML = '';
                return;
            }

            dropdown.innerHTML = filtered.map(c => {
                const bal = round2(c.netBalanceVal || 0);
                const balTag = bal > 0.009
                    ? (c.isNetDebt ? `<span class="val-red" style="font-size:13px;" dir="ltr">${bal.toFixed(2)} عليه</span>` : `<span class="val-green" style="font-size:13px;" dir="ltr">${bal.toFixed(2)} له</span>`)
                    : `<span class="text-muted" style="font-size:13px;">صافي</span>`;
                return `
                    <div class="list-search-item" data-cid="${safeHTML(c.id)}">
                        <span>${safeHTML(c.name)}</span>
                        ${balTag}
                    </div>
                `;
            }).join('');
            dropdown.style.display = 'block';

            dropdown.querySelectorAll('.list-search-item[data-cid]').forEach(el => {
                const cid = el.getAttribute('data-cid');
                window.SerajUI.bindSafeTap(el, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const matched = filtered.find(x => String(x.id) === String(cid));
                    if (matched) confirmCustomerSelection(matched);
                }, 250);
            });
        }

        function confirmCustomerSelection(customerObj) {
            closeAllMenus();
            selectedCustomerId = customerObj.id;
            selectedCustomerObj = customerObj;
            document.getElementById('reportHeaderTitle').innerHTML = `كشف حساب العميل: <span class="tag-customer">${safeHTML(customerObj.name)}</span>`;
            switchView('customer-statement-view');
            if (!(history.state && history.state.view === 'statement')) {
                history.pushState({ view: 'statement' }, '');
            }
            renderStatementTable();
        }

        // =========================================================================
        // الفلترة الزمنية
        // =========================================================================
        function filterByDate(label, val) {
            currentDateFilter = val;
            currentDurationLabel = label;
            document.getElementById('currentDurationLabelOutside').textContent = label;
            closeAllMenus();
            if (selectedCustomerId) renderStatementTable();
        }

        function openCustomDateModal() {
            closeAllMenus();
            window.SerajUI.openModal('customDateModal');
        }

        function applyCustomDate() {
            const f = document.getElementById('dateFrom').value;
            const t = document.getElementById('dateTo').value;
            if (!f || !t) return SerajAlert('يرجى تحديد تاريخ البداية والنهاية.', 'error');
            currentDateFilter = 'custom';
            customDateFrom = f;
            customDateTo = t;
            currentDurationLabel = `${f} إلى ${t}`;
            document.getElementById('currentDurationLabelOutside').textContent = 'تاريخ مخصص';
            window.SerajUI.closeModal('customDateModal');
            if (selectedCustomerId) renderStatementTable();
        }

        // =========================================================================
        // بناء جدول كشف الحساب من المحرك المركزي DB.getCustomerStatement
        // (صافي نهاية الفترة + حقل الرصيد الكلي الحالي currentAllTimeNetDebt منفصل)
        // =========================================================================
        function renderStatementTable() {
            if (!selectedCustomerId) return;
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;

            const stmt = DB.getCustomerStatement(selectedCustomerId, currentDateFilter, customDateFrom, customDateTo);
            if (!stmt) {
                tbody.innerHTML = `<tr><td colspan="3" style="padding: 24px; color: var(--text-muted);">تعذر تحميل بيانات العميل</td></tr>`;
                return;
            }
            selectedCustomerObj = stmt.entity;
            lastStatementData = stmt;

            const rows = [];

            if (currentDateFilter !== 'allTime' && (stmt.prevAleih > 0 || stmt.prevLeh > 0)) {
                const prevNet = round2(stmt.prevAleih - stmt.prevLeh);
                const dPrevAleih = prevNet > 0 ? prevNet : 0;
                const dPrevLeh = prevNet < 0 ? Math.abs(prevNet) : 0;
                rows.push(`
                    <tr class="stmt-prev-row">
                        <td style="text-align: right; color: var(--text-muted);">رصيد حساب سابق (ما قبل الفترة)</td>
                        <td class="val-red" dir="ltr">${dPrevAleih > 0 ? dPrevAleih.toFixed(2) : '-'}</td>
                        <td class="val-green" dir="ltr">${dPrevLeh > 0 ? dPrevLeh.toFixed(2) : '-'}</td>
                    </tr>
                `);
            }

            if (stmt.rows.length === 0) {
                rows.push(`<tr><td colspan="3" style="padding: 22px; color: var(--text-muted);">لا توجد حركات مسجلة في هذه الفترة</td></tr>`);
            } else {
                stmt.rows.forEach(item => {
                    const safeTitle = window.Utils.sanitizeRichHTML(item.title || '');
                    const hasNotes = Boolean(item.notes && item.notes !== '---');
                    const notesHtml = hasNotes
                        ? `<div class="color-notes" style="margin-top: 3px;">📝 ${safeHTML(item.notes)}</div>`
                        : '';
                    rows.push(`
                        <tr>
                            <td style="text-align: right;">
                                <div>${safeTitle}</div>
                                <div class="cell-meta">📅 ${safeHTML(item.date || '')}</div>
                                ${notesHtml}
                            </td>
                            <td class="val-red" dir="ltr">${item.aleih > 0 ? item.aleih.toFixed(2) : '-'}</td>
                            <td class="val-green" dir="ltr">${item.leh > 0 ? item.leh.toFixed(2) : '-'}</td>
                        </tr>
                    `);
                });
            }

            rows.push(`
                <tr class="stmt-total-row">
                    <td style="text-align: right;">إجمالي الحركات للفترة:</td>
                    <td class="val-red" dir="ltr">${round2(stmt.totalAleih).toFixed(2)}</td>
                    <td class="val-green" dir="ltr">${round2(stmt.totalLeh).toFixed(2)}</td>
                </tr>
            `);

            const periodNet = round2(stmt.netDebt);
            const periodClass = periodNet > 0.009 ? 'val-red' : (periodNet < -0.009 ? 'val-green' : '');
            const periodText = periodNet > 0.009
                ? `عليه مديونية ${Math.abs(periodNet).toFixed(2)}`
                : (periodNet < -0.009 ? `له رصيد ${Math.abs(periodNet).toFixed(2)}` : 'الرصيد مصفّر (0.00)');

            rows.push(`
                <tr class="stmt-net-row">
                    <td style="text-align: right;">${currentDateFilter === 'allTime' ? 'الرصيد الصافي النهائي:' : 'صافي الرصيد بنهاية الفترة:'}</td>
                    <td colspan="2" class="${periodClass}">${periodText}</td>
                </tr>
            `);

            if (currentDateFilter !== 'allTime' && Math.abs(round2(stmt.currentAllTimeNetDebt) - periodNet) > 0.009) {
                const allTimeNet = round2(stmt.currentAllTimeNetDebt);
                const allTimeClass = allTimeNet > 0.009 ? 'val-red' : (allTimeNet < -0.009 ? 'val-green' : '');
                const allTimeText = allTimeNet > 0.009
                    ? `عليه مديونية ${Math.abs(allTimeNet).toFixed(2)}`
                    : (allTimeNet < -0.009 ? `له رصيد ${Math.abs(allTimeNet).toFixed(2)}` : 'الرصيد مصفّر (0.00)');
                rows.push(`
                    <tr class="stmt-alltime-row">
                        <td style="text-align: right; color: var(--text-muted);">الرصيد الإجمالي الحالي (حتى اليوم):</td>
                        <td colspan="2" class="${allTimeClass}">${allTimeText}</td>
                    </tr>
                `);
            }

            tbody.innerHTML = rows.join('');
        }

        // =========================================================================
        // الطباعة (فصل 80mm عن A4) و PDF (downloadRealPDF) و Excel
        // =========================================================================
        function _buildA4StatementHTML() {
            const brand = window.PrintManager.getShopBranding();
            const todayStr = window.Utils.getLocalDateString();
            const c = selectedCustomerObj;
            const stmt = lastStatementData;

            const rows = [];
            if (currentDateFilter !== 'allTime' && (stmt.prevAleih > 0 || stmt.prevLeh > 0)) {
                const prevNet = round2(stmt.prevAleih - stmt.prevLeh);
                rows.push(`
                    <tr style="background:#f8fafc;">
                        <td colspan="2" style="text-align:right;">رصيد حساب سابق (ما قبل الفترة)</td>
                        <td class="val-red" dir="ltr">${prevNet > 0 ? prevNet.toFixed(2) : '-'}</td>
                        <td class="val-green" dir="ltr">${prevNet < 0 ? Math.abs(prevNet).toFixed(2) : '-'}</td>
                    </tr>
                `);
            }

            stmt.rows.forEach(item => {
                const cleanTitle = String(item.title || '').replace(/<[^>]*>?/gm, '');
                rows.push(`
                    <tr>
                        <td style="text-align:right; width:40%;"><strong>${safeHTML(cleanTitle)}</strong><br><span style="font-size:11px; color:#555;">${safeHTML(item.date || '')}</span></td>
                        <td style="width:26%; font-size:13px;">${safeHTML(item.notes || '---')}</td>
                        <td class="val-red" style="width:17%;" dir="ltr">${item.aleih > 0 ? item.aleih.toFixed(2) : '-'}</td>
                        <td class="val-green" style="width:17%;" dir="ltr">${item.leh > 0 ? item.leh.toFixed(2) : '-'}</td>
                    </tr>
                `);
            });

            rows.push(`
                <tr style="background:#e2e8f0;">
                    <td colspan="2" style="text-align:right;">إجمالي الحركات للفترة:</td>
                    <td class="val-red" dir="ltr">${round2(stmt.totalAleih).toFixed(2)}</td>
                    <td class="val-green" dir="ltr">${round2(stmt.totalLeh).toFixed(2)}</td>
                </tr>
            `);

            const periodNet = round2(stmt.netDebt);
            const periodClass = periodNet > 0.009 ? 'val-red' : (periodNet < -0.009 ? 'val-green' : '');
            const periodText = periodNet > 0.009
                ? `عليه مديونية ${Math.abs(periodNet).toFixed(2)} ج`
                : (periodNet < -0.009 ? `له رصيد ${Math.abs(periodNet).toFixed(2)} ج` : 'الرصيد مصفّر (0.00)');

            rows.push(`
                <tr style="background:#f1f5f9;">
                    <td colspan="2" style="text-align:right; font-size:16px;">${currentDateFilter === 'allTime' ? 'الرصيد الصافي النهائي:' : 'صافي الرصيد بنهاية الفترة:'}</td>
                    <td colspan="2" class="${periodClass}" style="font-size:17px;">${periodText}</td>
                </tr>
            `);

            if (currentDateFilter !== 'allTime' && Math.abs(round2(stmt.currentAllTimeNetDebt) - periodNet) > 0.009) {
                const allTimeNet = round2(stmt.currentAllTimeNetDebt);
                const allTimeClass = allTimeNet > 0.009 ? 'val-red' : (allTimeNet < -0.009 ? 'val-green' : '');
                const allTimeText = allTimeNet > 0.009
                    ? `عليه مديونية ${Math.abs(allTimeNet).toFixed(2)} ج`
                    : (allTimeNet < -0.009 ? `له رصيد ${Math.abs(allTimeNet).toFixed(2)} ج` : 'الرصيد مصفّر (0.00)');
                rows.push(`
                    <tr style="background:#ffffff;">
                        <td colspan="2" style="text-align:right;">الرصيد الإجمالي الحالي (حتى اليوم):</td>
                        <td colspan="2" class="${allTimeClass}">${allTimeText}</td>
                    </tr>
                `);
            }

            return `
                <div dir="rtl" style="background:#fff; color:#000; padding:12px; font-family:Tahoma, Arial, sans-serif;">
                    <div style="text-align:center; border-bottom:3px solid #000; padding-bottom:10px; margin-bottom:14px;">
                        <h1 style="margin:0; font-size:26px;">${safeHTML(brand.shopName)}</h1>
                        ${brand.shopPhone ? `<div style="font-size:13px; margin-top:3px;">ت: ${safeHTML(brand.shopPhone)}</div>` : ''}
                        <div style="font-size:16px; font-weight:bold; margin-top:4px;">كشف حساب تفصيلي للعميل</div>
                    </div>
                    <div style="display:flex; justify-content:space-between; border:2px solid #000; border-radius:6px; padding:10px 14px; margin-bottom:14px; font-size:14px; font-weight:bold; background:#f8fafc;">
                        <div>
                            <div>اسم العميل: ${safeHTML(c.name || '')}</div>
                            <div style="margin-top:4px;">الموبايل: <span dir="ltr">${safeHTML(c.phone || '---')}</span></div>
                        </div>
                        <div style="text-align:left;">
                            <div>تاريخ الكشف: ${safeHTML(todayStr)}</div>
                            <div style="margin-top:4px;">الفترة: ${safeHTML(currentDurationLabel)}</div>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align:right; width:40%;">البيان والتاريخ</th>
                                <th style="width:26%;">الملاحظات</th>
                                <th class="val-red" style="width:17%;">عليه (مديونية)</th>
                                <th class="val-green" style="width:17%;">له (تسديد)</th>
                            </tr>
                        </thead>
                        <tbody>${rows.join('')}</tbody>
                    </table>
                    <div style="text-align:center; margin-top:16px; border-top:2px dashed #000; padding-top:8px; font-size:13px; font-weight:bold;">
                        ${safeHTML(brand.footerNote)}
                    </div>
                </div>
            `;
        }

        function printThermalReport() {
            const brand = window.PrintManager.getShopBranding();
            const c = selectedCustomerObj;
            const stmt = lastStatementData;

            let rowsHtml = '';
            if (currentDateFilter !== 'allTime' && (stmt.prevAleih > 0 || stmt.prevLeh > 0)) {
                const prevNet = round2(stmt.prevAleih - stmt.prevLeh);
                rowsHtml += `<div style="border-bottom:1px dashed #000; padding:4px 0; font-weight:bold;">رصيد سابق: ${prevNet > 0 ? ('عليه ' + prevNet.toFixed(2)) : ('له ' + Math.abs(prevNet).toFixed(2))}</div>`;
            }

            stmt.rows.forEach(item => {
                const cleanTitle = String(item.title || '').replace(/<[^>]*>?/gm, '');
                const notePart = (item.notes && item.notes !== '---') ? ` (${item.notes})` : '';
                rowsHtml += `
                    <div style="border-bottom:1px dotted #333; padding:4px 0; font-size:12px;">
                        <div style="font-weight:bold;">${safeHTML(cleanTitle + notePart)}</div>
                        <div style="display:flex; justify-content:space-between;">
                            <span>${safeHTML(item.date || '')}</span>
                            <span dir="ltr">عليه: ${round2(item.aleih).toFixed(2)} | له: ${round2(item.leh).toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });

            const net = round2(stmt.netDebt);
            const netText = net > 0.009 ? `عليه مديونية: ${Math.abs(net).toFixed(2)} ج` : (net < -0.009 ? `له رصيد: ${Math.abs(net).toFixed(2)} ج` : 'الرصيد مصفّر (0.00)');

            const docHtml = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>كشف حساب ${safeHTML(c.name)}</title><style>@page{size:80mm auto;margin:0;}body{margin:0;padding:4mm 2mm;width:74mm;box-sizing:border-box;font-family:Tahoma,Arial,sans-serif;font-size:12px;color:#000;background:#fff;}</style></head><body>
                <div style="text-align:center; border-bottom:2px dashed #000; padding-bottom:6px; margin-bottom:8px;">
                    <div style="font-size:17px; font-weight:bold;">${safeHTML(brand.shopName)}</div>
                    ${brand.shopPhone ? `<div>ت: ${safeHTML(brand.shopPhone)}</div>` : ''}
                    <div style="font-weight:bold;">كشف حساب العميل: ${safeHTML(c.name)}</div>
                    <div>${safeHTML(currentDurationLabel)}</div>
                </div>
                ${rowsHtml}
                <div style="border-top:2px dashed #000; margin-top:8px; padding-top:6px; font-weight:bold;">
                    <div>إجمالي عليه: ${round2(stmt.totalAleih).toFixed(2)} | إجمالي له: ${round2(stmt.totalLeh).toFixed(2)}</div>
                    <div style="font-size:14px; margin-top:4px;">${netText}</div>
                </div>
                <div style="text-align:center; margin-top:10px; border-top:1px dashed #000; padding-top:6px;">${safeHTML(brand.footerNote)}</div>
            </body></html>`;
            window.PrintManager._printHtmlViaSafeIframe(docHtml);
        }

        function handlePrintAction(action) {
            closeAllMenus();
            if (!selectedCustomerObj || !lastStatementData) {
                return SerajAlert('الرجاء اختيار عميل أولاً لعرض كشف حسابه.', 'info');
            }

            const safeName = String(selectedCustomerObj.name || 'Customer').replace(/[/\\?*:[\]\s]+/g, '_').slice(0, 25);

            if (action === 'thermal') {
                printThermalReport();
            } else if (action === 'a4') {
                window.PrintManager.printA4HTML(_buildA4StatementHTML(), `كشف حساب - ${selectedCustomerObj.name}`);
            } else if (action === 'pdf_export') {
                window.Utils.downloadRealPDF(_buildA4StatementHTML(), `Statement_${safeName}.pdf`);
            } else if (action === 'excel_export') {
                const stmt = lastStatementData;
                const brand = window.PrintManager.getShopBranding();
                const excelData = [
                    [`${brand.shopName} - كشف حساب عميل`],
                    ['العميل:', String(selectedCustomerObj.name || ''), 'الموبايل:', String(selectedCustomerObj.phone || '---')],
                    ['الفترة:', currentDurationLabel, 'التاريخ:', window.Utils.getLocalDateString()],
                    [],
                    ['التاريخ', 'البيان', 'الملاحظات', 'مديونية (عليه)', 'تسديد (له)']
                ];
                if (currentDateFilter !== 'allTime' && (stmt.prevAleih > 0 || stmt.prevLeh > 0)) {
                    const prevNet = round2(stmt.prevAleih - stmt.prevLeh);
                    excelData.push(['', 'رصيد حساب سابق', '', prevNet > 0 ? prevNet : 0, prevNet < 0 ? Math.abs(prevNet) : 0]);
                }
                stmt.rows.forEach(item => {
                    const cleanTitle = String(item.title || '').replace(/<[^>]*>?/gm, '');
                    excelData.push([item.date || '', cleanTitle, item.notes || '---', round2(item.aleih), round2(item.leh)]);
                });
                excelData.push([]);
                excelData.push(['', 'إجمالي الحركات', '', round2(stmt.totalAleih), round2(stmt.totalLeh)]);
                excelData.push(['', 'الرصيد الصافي النهائي', '', stmt.netDebt > 0 ? round2(stmt.netDebt) : 0, stmt.netDebt < 0 ? round2(Math.abs(stmt.netDebt)) : 0]);
                window.PrintManager.exportToExcel(excelData, `Statement_${safeName}`);
            }
        }

        async function initPage() {
            await window.SerajMegaDB.ready;
            DB.applySavedTheme();
            window.SerajAuth.applyRoleGuards();
            updatePageBranding();
            setTimeout(() => document.getElementById('customerSearchInput')?.focus(), 100);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPage();
        });

        window.addEventListener('seraj:updated', (e) => {
            const col = e && e.detail ? e.detail.collection : null;
            if (!col || ['all', 'customers', 'customer_vouchers', 'sales_invoices', 'treasury_moves', 'store_settings'].includes(col)) {
                updatePageBranding();
                if (selectedCustomerId) renderStatementTable();
            }
        });

        window.addEventListener('popstate', () => {
            if (window.SerajUI._modalStack.length > 0) return;
            if (document.getElementById('customer-statement-view').classList.contains('active-view')) {
                handleSmartBack(true);
            }
        });
    </script>
</body>
</html>
